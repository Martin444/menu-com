[build]
  command = "npm run build"
  # The adapter writes to .svelte-kit/netlify. We override the UI "dist"
  # setting so Netlify publishes from the adapter's actual output directory.
  publish = ".svelte-kit/netlify"

[build.environment]
  NODE_VERSION = "20"

# Required environment variables (set in Netlify dashboard → Site settings → Environment variables):
# VITE_API_URL=https://menucom-api-production.up.railway.app
#
# For branch deploys or preview deploys pointing to staging API:
# [context.deploy-preview.environment]
#   VITE_API_URL = "https://menucom-api-staging.up.railway.app"
#
# [context.branch-deploy.environment]
#   VITE_API_URL = "https://menucom-api-staging.up.railway.app"
